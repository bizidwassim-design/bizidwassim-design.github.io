name: Deploy portfolio to GitHub Pages

# The portfolio's single source of truth is the public website repository
# (bizidwassim-design/brainfortsecurity.com). This workflow builds it and publishes
# only the portfolio page, so the two sites never drift apart.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # daily rebuild picks up portfolio changes made on the website

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the website source
        uses: actions/checkout@v4
        with:
          repository: bizidwassim-design/brainfortsecurity.com
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the static export
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Keep only the portfolio
        run: bash tools/assemble.sh site/out _site

      - name: Check the result
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
          grep -q "Wassim Bizid" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
